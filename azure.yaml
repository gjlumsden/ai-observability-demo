name: ai-observability-demo
metadata:
  template: ai-observability-demo@0.1.0
services:
  web:
    project: ./src/web
    language: js
    host: appservice
  usageProcessor:
    project: ./src/usage-processor
    language: python
    host: function
    resourceName: ${USAGE_PROCESSOR_FUNCTION_NAME}
hooks:
  preprovision:
    shell: pwsh
    run: ./hooks/preprovision.ps1
  postprovision:
    shell: pwsh
    run: ./hooks/postprovision.ps1
  postdeploy:
    shell: pwsh
    run: ./hooks/postdeploy.ps1
  predown:
    shell: pwsh
    run: ./hooks/predown.ps1
  postdown:
    shell: pwsh
    run: ./hooks/postdown.ps1
